[package]
name = "studypulse-client"
version = "0.4.1"
description = "Local-first StudyPulse desktop client"
authors = ["StudyPulse"]
edition = "2024"
rust-version = "1.97.1"
build = "build.rs"

[lib]
name = "studypulse_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "studypulse-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
keyring = "4.1.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
studypulse-ffi = { path = "../core/crates/studypulse-ffi" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
