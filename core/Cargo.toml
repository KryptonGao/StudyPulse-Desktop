[workspace]
resolver = "3"
members = [
    "crates/studypulse-workspace",
    "crates/studypulse-tools",
    "crates/studypulse-model-client",
    "crates/studypulse-agent",
    "crates/studypulse-ffi",
    "crates/studypulse-runner",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
hex = "0.4.3"
parking_lot = "0.12.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "blocking", "rustls-tls"] }
quick-xml = { version = "0.37.5", features = ["serialize"] }
schemars = { version = "1.0.4", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
tracing = "0.1.41"
uniffi = { version = "0.30.0", features = ["cli"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
