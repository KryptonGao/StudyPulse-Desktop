<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <!-- Chinese artwork -->
  <title id="hero-title">StudyPulse — local-first learning workspace</title>
  <desc id="hero-desc">A warm editorial illustration showing StudyPulse turning local study records into review, trends, and optional Agent work.</desc>

  <rect width="1200" height="420" rx="30" fill="#f5f2ea"/>
  <path d="M648 0v420" stroke="#ded8cb" stroke-width="1" opacity=".7"/>
  <path d="M56 336h536" stroke="#ded8cb" stroke-width="1"/>
  <circle cx="1086" cy="60" r="150" fill="#efebe1" opacity=".72"/>
  <circle cx="1086" cy="60" r="104" fill="none" stroke="#ded8cb" stroke-width="1" stroke-dasharray="4 9"/>

  <g id="identity" transform="translate(64 54)">
    <text x="0" y="0" fill="#526c58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2.6">LOCAL-FIRST / STUDY WORKSPACE</text>
    <text x="0" y="86" fill="#25241f" font-family="Georgia, 'Songti SC', serif" font-size="78" font-weight="500" letter-spacing="-2.8">StudyPulse</text>
    <text x="0" y="136" fill="#25241f" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600">把学习记录，放在一个</text>
    <text x="0" y="178" fill="#25241f" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600">可以回来的地方。</text>
    <text x="0" y="230" fill="#777267" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">任务 · 复习 · 趋势 · 资料库 · Agent</text>
    <text x="0" y="306" fill="#777267" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">React + Tauri 2 + Rust Core</text>
    <circle cx="298" cy="300" r="5" fill="#bd8069"/>
    <text x="316" y="306" fill="#777267" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">macOS / Windows</text>
  </g>

  <g id="workspace-proof" transform="translate(704 50)">
