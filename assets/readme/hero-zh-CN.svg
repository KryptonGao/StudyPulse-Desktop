    </g>
    <g transform="translate(78 228)">
      <text x="0" y="0" fill="#25241f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">AGENT</text>
      <text x="0" y="25" fill="#777267" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">看得见的工作时间线</text>
